[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-crypto",
    "crates/aegis-ratchet",
    "crates/aegis-vault",
    "crates/aegis-file",
    "crates/aegis-net",
    "crates/aegis-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Basty-devel/AEGIS"

[workspace.lints.rust]
# Spec: AEGIS.Plan.V0.2.md Section 10 — unsafe permitted only in explicitly
# identified FFI/hardware-binding crates, which override this with a
# narrowly scoped `#[allow(unsafe_code)]` at the point of use.
unsafe_code = "deny"

[patch.crates-io]
# `nestler-hybrid-array` (github.com/Basty-devel/nestler-hybrid-array) is
# an independently-authored, from-scratch replacement for hybrid-array,
# built directly from its public API contract rather than its source —
# not a fork. It exists because `primeorder::PrimeCurveParams` (needed by
# bp512-nestler, for brainpoolP512r1) requires an array size (513) that
# was missing from every released hybrid-array version at the time, and
# because a `[patch.crates-io]` entry — the only way to add that size
# locally — never travels with a crate's own `cargo publish`
# verification build, so `aegis-crypto` could never be published to
# crates.io while patching the *real* hybrid-array this way regardless.
# See that repo's README for the full rationale and scope.
#
# Verified against this exact workspace: `cargo build --workspace` and
# `cargo test --workspace` (73 tests, including the ML-KEM-1024 and
# ML-DSA-87 ACVP vectors) both pass with this patch in place.
#
# BLAST RADIUS: `[patch.crates-io]` is workspace-wide and cannot be
# scoped to one dependency. Although the only crate that *needs* the
# size-513 fix is `bp512-nestler` (via `primeorder`), this replacement of
# `hybrid-array` is also linked into `sha2`, `sha3`, `ml-kem`, `ml-dsa`,
# `aes-gcm`, and `chacha20poly1305` — i.e. every primitive in
# `aegis-crypto` except Argon2id, BLAKE3, and Ed25519 runs on
# `nestler-hybrid-array`, not the crates.io release of `hybrid-array`.
#
# NOTE: this patch has the same fundamental limitation as the vendored
# one it replaces — it is workspace-local and will not carry over to a
# published crate's own verification build. `cargo publish -p
# aegis-crypto` remains blocked until upstream hybrid-array ships a
# release covering size 513 (https://github.com/RustCrypto/hybrid-array/
# pull/233, merged 2026-08-11, not yet in a release as of 0.4.14).
hybrid-array = { git = "https://github.com/Basty-devel/nestler-hybrid-array", branch = "master" }
