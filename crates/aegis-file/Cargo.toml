[package]
name = "aegis-file"
version.workspace = true
edition.workspace = true
description = "Chunked AEAD file streaming engine (up to 1 GiB) with BLAKE3 Merkle tree integrity verification and bounded 4 MiB memory buffering for the AegisPQC messenger. NOT independently audited."
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[dependencies]
aegis-crypto = { path = "../aegis-crypto", version = "0.1.4" }
blake3 = "1.8.7"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
