[package]
name = "aegis-crypto"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
aead = "0.6.1"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
blake3 = "1.8.7"
bp512-nestler = "0.1.2"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
elliptic-curve = { version = "0.14.1", features = ["ecdh"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
ml-dsa = "0.1.1"
ml-kem = "0.3.2"
sha2 = "0.11.0"
signature = "3.0.0"
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
