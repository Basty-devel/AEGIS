[package]
name = "aegis-vault-pqc"
version = "0.1.0"
edition.workspace = true
description = "SQLCipher-encrypted local storage with hardware-backed (Windows Credential Manager / Linux Secret Service) key isolation and GDPR Art. 17/20 compliance engines for the AegisPQC messenger. NOT independently audited."
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
repository.workspace = true
rust-version = "1.75"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
aegis-crypto = { path = "../aegis-crypto", version = "0.1.4" }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.2"
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"

[dev-dependencies]
hex = "0.4"
